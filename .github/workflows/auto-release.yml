name: Auto Release
# Publishes @devsforfun/id-sdk to npm whenever package.json's version is bumped
# on main. Deliberately a SINGLE workflow (build+test+publish+tag), not a
# tag-then-react-to-release-event split: GitHub Actions refuses to let events
# created by the default GITHUB_TOKEN trigger a second workflow run (its
# anti-recursion rule), so a "create the release, let release.yml react to
# it" design silently never runs the publish step. Doing everything in one
# job sidesteps that rule entirely — there's nothing left to (fail to)
# trigger.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch: {} # manual escape hatch — re-run by hand if this ever needs a retry
permissions:
  contents: write # to create the tag + GitHub Release
  id-token: write # npm trusted publishing (OIDC provenance)
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          if git rev-parse "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 24 # npm@11 (below) requires Node ^22.22.2 || ^24.15.0 || >=26 — keep these two in lockstep
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11 # trusted publishing needs npm >= 11.5; major-pinned (not @latest) so a future npm major can't raise its Node floor out from under this runner again
        if: steps.check.outputs.exists == 'false'
      - run: npm ci
        if: steps.check.outputs.exists == 'false'
      - run: npm test
        if: steps.check.outputs.exists == 'false'
      - run: npm run build
        if: steps.check.outputs.exists == 'false'
      - name: npm publish v${{ steps.pkg.outputs.version }}
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          # OIDC trusted publishing is preferred (needs no secret — see RELEASING.md
          # for the one-time npmjs.com setup). This is the fallback if that isn't
          # configured yet, or for orgs that stick with token auth.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag + GitHub Release v${{ steps.pkg.outputs.version }}
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.pkg.outputs.version }}" \
            --title "v${{ steps.pkg.outputs.version }}" \
            --notes "See the Changelog section in README.md for details." \
            --generate-notes
