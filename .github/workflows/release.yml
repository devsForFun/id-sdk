name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC provenance)
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm@11 (below) requires Node ^22.22.2 || ^24.15.0 || >=26 — keep these two in lockstep
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11 # trusted publishing needs npm >= 11.5; major-pinned (not @latest) so a future npm major can't raise its Node floor out from under this runner again
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          # Ignored when npm trusted publishing is configured; fallback otherwise.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
